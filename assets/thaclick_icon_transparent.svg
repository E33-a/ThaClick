<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  
  

  

  <!-- The ThaClick Neon Cursor (Rotated 45deg to point top-right) -->
  <g filter="url(#neonGlow)" transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Base glowing shape -->
    <path d="M256 120 L360 380 L280 340 L256 440 L232 340 L152 380 Z" fill="none" stroke="#00E5FF" stroke-width="16" stroke-linejoin="round"/>
    <path d="M256 120 L360 380 L280 340 L256 440 L232 340 L152 380 Z" fill="#00E5FF" fill-opacity="0.15"/>
  </g>
  
  <!-- Central bright core of the neon (White-hot center) -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <path d="M256 120 L360 380 L280 340 L256 440 L232 340 L152 380 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
